  - variant_id: anchor_edge_distance_failure
    expected_result: fail
    failure_stage: anchor_geometry
    overlay_type: row_level_patch
    row_overlays:
      anchor-check-oracle.csv:
        update:
          - match:
              support_id: BR-C01
            values:
              edge_distance_x_mm: 60
              edge_distance_ok: false
              status: fail
    expected_diagnostic: Anchor edge distance is below the embedded capacity excerpt minimum.
  - variant_id: anchor_spacing_failure
    expected_result: fail
    failure_stage: anchor_geometry
    overlay_type: row_level_patch
    row_overlays:
      anchor-check-oracle.csv:
        update:
          - match:
              support_id: BR-E01
            values:
              nearest_anchor_spacing_mm: 80
              spacing_ok: false
              status: fail
    expected_diagnostic: Anchor spacing is below the embedded capacity excerpt minimum.
  - variant_id: corner_pressure_over_limit
    expected_result: fail
    failure_stage: utilization
    overlay_type: row_level_patch
    row_overlays:
      pressure-schedule.csv:
        update:
          - match:
              zone_id: ZC
            values:
              pressure_kpa: -3.00
              governing_pressure: 1
      calculation-oracle.csv:
        update:
          - match:
              support_id: BR-C01
            values:
              pressure_kpa: -3.00
              wind_load_kN: 2.700
              bracket_horizontal_utilization: 0.964
              anchor_tension_utilization: 1.080
              anchor_combined_utilization: 1.085
              governing_utilization: 1.085
              status: fail
      anchor-check-oracle.csv:
        update:
          - match:
              support_id: BR-C01
            values:
              tension_demand_kN: 2.700
              tension_utilization: 1.080
              combined_utilization: 1.085
              status: fail
    expected_diagnostic: Row with governing_utilization greater than 1.0 is marked fail.
