  <rect x="220" y="160" width="120" height="140" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <text x="280" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#1d4ed8">OPENING-02</text>
  <g font-family="Arial, sans-serif" font-size="30" fill="#111827">
