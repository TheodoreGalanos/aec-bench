<!-- ABOUTME: Expanded docs-only facade elevation variant with a second opening. -->
<!-- ABOUTME: Provides concrete research geometry before executable verifier work. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Task-owned redrawn facade elevation variant with added opening and edge support">
