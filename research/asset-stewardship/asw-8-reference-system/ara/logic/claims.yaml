claims:
  - id: C001
    statement: The accepted two-pump profile and current physical and resource records cannot represent ASW-8 without a separately identified profile and record extension.
    status: supported
    falsification_criteria:
      - The accepted v1 profile permits three pumps and two running pumps without changing its declared meaning.
      - The current physical and resource records already represent a three-pump running set and named quantity-bearing pools.
    proof:
      experiments: [E001]
      evidence: [EV001]
    dependencies: []
    provenance: ai_executed
    tags: [architecture, profile, compatibility]
    domain: {}
  - id: C002
    statement: One three-pump station is sufficient to exercise duty assignment, shared-resource exclusion, outage admission, collateral exposure, generated work, and four conservation reports without a network model.
    status: supported
    falsification_criteria:
      - Any required ASW-8 behaviour cannot be produced or distinguished inside the declared single-station boundary.
    proof:
      experiments: [E002, E005]
      evidence: [EV002, EV003]
    dependencies: [C001]
    provenance: user
    tags: [reference-system, scope]
    domain: {}
  - id: C003
    statement: Named resource pools and durable work-generation identities conserve resources and generated work across execution, suspension, cancellation, recovery, and handover.
    status: supported
    falsification_criteria:
      - A resource quantity becomes unaccounted for.
      - A v4 state accepts both legacy singleton resources and v4 pool resources or mixes their reservation forms.
      - A rule that declares one new work item creates zero or more than one new identity.
      - WG-08 or WG-09 fails to produce its declared existing-item transition or one authorised successor identity.
    proof:
      experiments: [E003, E005]
      evidence: [EV002, EV003]
    dependencies: [C002]
    provenance: ai_executed
    tags: [resources, backlog, conservation]
    domain: {}
  - id: C004
    statement: A registered RS1 descriptor, separate v2 station-data profile, world-run manifest v2, v4 durable record set, v5 actor projection, and rollout-control v2 can add ASW-8 while preserving accepted historical bytes and replay.
    status: supported
    falsification_criteria:
      - An old package, manifest, state, view, or replay artifact changes or a v4 state omits inherited evidence-health fields.
      - A run can claim RS1 while using a different opening-state or event-schedule artifact.
      - A v2 rollout record enters the v1 rollout-control schema or a v1 record enters the v2 route.
    proof:
      experiments: [E002, E004]
      evidence: [EV001, EV002, EV003]
    dependencies: [C001]
    provenance: ai_executed
    tags: [versioning, replay, compatibility]
    domain: {}
  - id: C005
    statement: Planned outage admission can use only actor-visible service intervals while hidden future events remain able to interrupt work without leaking through the admission decision.
    status: supported
    falsification_criteria:
      - Actor-equivalent current views receive different admission decisions because their private future events differ.
      - A hidden safety event cannot suspend or interrupt already active work through normal event ordering.
    proof:
      experiments: [E003, E005]
      evidence: [EV002, EV003]
    dependencies: [C002]
    provenance: ai_executed
    tags: [information-boundary, outage, fairness]
    domain: {}
  - id: C006
    statement: A branch-neutral RS1 temporal template and task-local semantic outcome can give direct and Harbor roots and inherited child corpora the same evidence and evaluation meaning without requiring independent root hashes to match.
    status: supported
    falsification_criteria:
      - RS1 advertises search or fetch without a verified usable temporal repository.
      - The C collateral note is visible before its declared availability or absent after it.
      - Direct and Harbor semantic outcomes differ after run-specific identities are excluded.
      - Cross-transport parity requires equality of StewardshipEvaluationEvidence or another branch-specific content identity.
      - A rollout child rebuilds or changes the parent's public temporal bundle instead of inheriting it exactly.
    proof:
      experiments: [E004, E005]
      evidence: [EV001, EV002, EV003]
    dependencies: [C004, C005]
    provenance: ai_executed
    tags: [temporal-evidence, harbor, parity]
    domain: {}
  - id: C007
    statement: One bounded model can interpret the named projection-v5 pump boundaries and availability predicates, choose one supported stewardship action, and preserve exact decision-time proposal context without private leakage.
    status: supported
    falsification_criteria:
      - The model relies on latent state or hidden future events.
      - The selected action is invalid, lacks its required exact identifiers or natural-language reason, or cannot replay from durable evidence.
      - The actor proposal loses its observed view or information-set binding.
      - A credential, client record, or latent pump-condition field enters the model-visible evidence.
    proof:
      experiments: [E006]
      evidence: [EV004]
    dependencies: [C004, C005]
    provenance: ai_executed
    tags: [agent, behaviour, information-boundary]
    domain: {}
