experiments:
  - id: E001
    verifies: [C001]
    purpose: Compare the supplied ASW-8 design with the accepted v1 profile and current pump-station implementation.
    setup: Commit f73c692e606c2319d143bcd27cb4aafdd8d38571, tree a960c51fb12621be88aaa368880f0aba8bdd773c, and the complete ASW-8 design supplied by Theo.
    procedure:
      - Inspect the v1 profile boundary and change-control rule.
      - Trace station-data loading, physical model and state, operation, resources, actor views, persistence, replay, Harbor, evaluation, and rollout control.
      - Record reusable behaviour, structural limits, version conflicts, and task ownership.
      - Check the fixed B post-test and C inspection conditions through the current pump-local kernel with copied certified constants.
    metrics:
      - Direct source paths and symbols for every ASW-8 concern.
      - Number of unresolved architecture conflicts after the design correction.
    evidence: [EV001]
    exploratory: false
    domain: {}
  - id: E002
    verifies: [C002, C004]
    purpose: Prove strict v2 station-data identity, three-pump topology, and historical compatibility.
    setup: Separately generated, certified, and promoted v2 station data, registered RS1 descriptor, opening-state specification, event schedule, and preserved v1 fixtures.
    procedure:
      - Reject wrong identity, topology, inventory, and hashes.
      - Load the exact v2 package and compile three pumps with no more than two running.
      - Bind the exact RS1 descriptor, opening-state specification, event-schedule identities and hashes through world-run manifest v2; reject any mismatch or ASW-8 caller override.
      - Reload and replay all preserved manifest v1, state v1-v3, and actor-view v3-v4 fixtures.
    metrics:
      - Focused package and version test results.
      - Exact historical byte comparisons.
    evidence: [EV002, EV003]
    exploratory: false
    domain: {}
  - id: E003
    verifies: [C003, C005]
    purpose: Prove outage, resource-pool, backlog, exactly-once generation, and conservation rules.
    setup: V2 station data, v4 state, declared service schedule, resource windows, and all WG rules.
    procedure:
      - Exercise admitted and rejected planned outages against disclosed service intervals.
      - Compare actor-equivalent states with different hidden future events.
      - Reserve, suspend, resume, cancel, consume, and replenish resources.
      - Apply each work-generation rule with retry and recovery.
      - Inject one mismatch into each derived balance and require verification failure.
    metrics:
      - Focused unit and integration test results.
      - Unique generation identities and valid conservation sections.
    evidence: [EV002, EV003]
    exploratory: false
    domain: {}
  - id: E004
    verifies: [C004, C006]
    purpose: Prove v4 persistence, v5 projection, replay, Harbor, TrialRecord, and ASW-7 branch compatibility.
    setup: One verified ASW-8 world and one ASW-7 rollout group from its current snapshot.
    procedure:
      - Snapshot, resume, hand over, replay, and evaluate the v4 run.
      - Execute the same task through installed JSON and local Harbor.
      - Recompute the conservation report during Harbor import.
      - Compare the normalized semantic outcome and exclude the complete transport-specific evaluation evidence object.
      - Bind the branch-neutral temporal template in the descriptor and each realised direct or Harbor root corpus in its own manifest; require a child to copy the parent's exact public bundle and add only child ancestry and fresh private retrieval state.
      - Prove query CCR28H with operations scope and one-result limit is absent at 93,600, v4 DOCUMENT_REVIEW_POINT stops continue_operation at 100,800 without refreshing observation sources, and exactly pump-c-collateral-inspection-note.v1 is then searchable and fetchable through the real temporal repository and gateway.
      - Initialise each child temporal corpus with the full ordered parent ancestry and a fresh child-private retrieval state; load that chain into every resumed access context.
      - Route v2 rollout requests and results through rollout-control v2 and reject every v1-v2 record combination without changing the v1 schema.
      - Change one child and prove its parent and sibling remain unchanged and no parent-private retrieval record was copied.
    metrics:
      - State, receipt, report, and evaluation parity.
      - Parent and sibling snapshot equality.
    evidence: [EV002, EV003]
    exploratory: false
    domain: {}
  - id: E005
    verifies: [C002, C003, C005, C006]
    purpose: Execute the complete Day 0 to Day 2 reference journey through the closed actor surface.
    setup: The exact ASW-8-RS1 initial state; Pump C normal baseline before the peak, A and B peak baseline, Pump A normal baseline after the peak; W1, W2, and W3 ending at Day 2 15:00; service, resources, and opening work.
    procedure:
      - Complete A verification before the peak.
      - Assign A and C for the peak and generate C work from B-attributed cover.
      - Clear, check, provisionally return, and verify B.
      - Move B through isolated_for_work, test_only, run_in_service, and service_available; record test-running exposure without service or collateral SCU.
      - Search for the C collateral note before and after its declared availability and fetch the one later result.
      - Select B verification despite C ranking first and keep the reason.
      - Assign A and B, inspect C outside the duty assignment, and retain the clearance-kit replenishment item.
      - Compare the final state and all four conservation reports with the declared result.
    metrics:
      - Exact final state.
      - Work identity equation 2 plus 4 equals 5 plus 1.
      - Liability identity equation 2 plus 3 equals 4 plus 1.
      - Zero unexplained resource or service residual.
    evidence: [EV002, EV003]
    exploratory: false
    domain: {}
  - id: E006
    verifies: [C007]
    purpose: Check whether one authorised model can use projection v5 and the closed actor tools without private leakage.
    setup: The exact ASW-8-RS1 opening state, model au.anthropic.claude-sonnet-4-6, four-turn maximum, and a one-action instruction.
    procedure:
      - Observe the named pump boundaries, availability predicates, service schedule, resource windows, and ranked backlog.
      - Permit documentary search only through the closed temporal tools.
      - Allow at most one supported stewardship action with exact required identifiers and a natural-language reason.
      - Reload and replay the durable run, typed proposal, and actor request.
      - Recompute actor-proposal, host-control, and conservation checks.
      - Scan the model-visible trajectory for credentials and latent condition fields.
    metrics:
      - Adapter status and model turns.
      - Input, output, cache-read, and cache-write tokens.
      - Action validity, replay validity, and separate step-type integrity.
      - Model-visible leakage scan.
    evidence: [EV004]
    exploratory: true
    domain: {}
