experiments:
  - id: E001
    verifies: [C001, C002]
    purpose: Validate strict case, pack, issue, receipt, review, and verifier contracts.
    setup: Frozen task-owned models and the one approved wrong-component issue class.
    procedure:
      - Construct valid and invalid preparation requests and case records.
      - Reject raw record replacement, unknown issue classes, physical mutations, and incomplete packs.
      - Compare public and private contract fields.
    metrics:
      - Rejected invalid record classes.
      - Public private field separation.
    evidence: [EV002, EV004]
    exploratory: false
    domain:
      test_layer: unit
  - id: E002
    verifies: [C001, C002, C003]
    purpose: Derive the fixed Pump A review case from a real completed rich-work history and evaluate the exact review.
    setup: Bundled approved station data, production state machine, and independent world replay.
    procedure:
      - Complete Pump A and Pump B maintenance work through production actions.
      - Verify the selected source snapshot.
      - Derive the treated closeout pack and submit the typed reference review.
      - Verify the source is unchanged and the review matches the private target.
    metrics:
      - Source snapshot equality.
      - Case and review verification result.
    evidence: [EV002, EV004]
    exploratory: false
    domain:
      test_layer: integration
  - id: E003
    verifies: [C002, C003, C004]
    purpose: Prove reviewer redaction, exact retry, handover, negative access, and immutable review publication.
    setup: One prepared case and two reviewer tenures.
    procedure:
      - Open the first reviewer tenure and inspect the visible pack.
      - Search actor material for private treatment and latent fields.
      - Hand over to a fresh tenure and submit the exact review.
      - Retry the review and attempt conflicting and stale submissions.
    metrics:
      - Visible pack equality.
      - Private field absence.
      - Published review count and identity.
    evidence: [EV002, EV004]
    exploratory: false
    domain:
      test_layer: integration
  - id: E004
    verifies: [C001, C004]
    purpose: Prove durable preparation, idempotence, source replay, and selected crash recovery.
    setup: Real filesystem world-run and review-case repositories.
    procedure:
      - Prepare the case and repeat the exact request after process restart.
      - Prepare a new request from the same source and compare source identity.
      - Interrupt publication at selected boundaries and recover the immutable case.
      - Reverify the source world and the derived case.
    metrics:
      - Case identity and count.
      - Source state and commit equality.
      - Recovery result.
    evidence: [EV002, EV004]
    exploratory: false
    domain:
      test_layer: integration
  - id: E005
    verifies: [C002, C003, C004]
    purpose: Compare the visible pack, review submission, and exact evaluation through direct Python and installed JSON.
    setup: One fixed prepared case and reference review.
    procedure:
      - Run the same reviewer actions through both interfaces.
      - Compare case, pack, handover, review, and evaluation identities.
      - Attempt host-private operations through the reviewer surface.
    metrics:
      - Public result equality.
      - Negative access result.
    evidence: [EV002, EV004]
    exploratory: false
    domain:
      test_layer: end_to_end
  - id: E006
    verifies: [C004]
    purpose: Execute and independently verify the same review case through local Harbor without a model provider.
    setup: Exported review task, deterministic reference reviewer, and hidden verifier runtime.
    procedure:
      - Run the provider-free reference reviewer through local Harbor.
      - Reload all review evidence outside the agent phase.
      - Compare the case and evaluation with the direct path.
    metrics:
      - Harbor reward.
      - Case, review, and evaluation parity.
    evidence: [EV002, EV003, EV004, EV012]
    exploratory: false
    domain:
      test_layer: end_to_end
  - id: E007
    verifies: [C005]
    purpose: Run one separately approved real model-agent shakedown on the fixed treated case.
    setup: Theo-approved EV006 authority for one AU Bedrock Claude Sonnet 4.6 run after E001 through E006 passed.
    procedure:
      - Open only the closed reviewer tools for one fixed case.
      - Capture the model actions and final typed review.
      - Independently evaluate the review and record token and cost evidence.
    metrics:
      - Exact review fields accepted.
      - Input, output, reported analysis, and total tokens.
      - Provider cost.
    evidence: [EV006, EV007, EV008, EV009, EV010, EV011]
    exploratory: true
    domain:
      test_layer: agent_shakedown
      provider_authority: f8cacee272560ecff04143372ec9b9da64d10aa8486248c1dc476bdfd1009a4e
      outcome: rejected
      provider_retries: 0
  - id: E008
    verifies: [C006]
    purpose: Prove the version 2 hybrid review contract without another provider call.
    setup: The accepted Pump A closeout case, version 1 compatibility models, version 2 reviewer tools, and the independent verifier.
    procedure:
      - Confirm that public process work accepts only declared action codes and requires a written review rationale.
      - Submit related-record assessments and extra visible source references while keeping the direct affected set strict.
      - Reject missing required actions, missing decisive sources, and records outside the visible pack.
      - Reload version 1 submissions and verifier targets without migration.
      - Exercise direct, installed JSON, durable repository, and local Harbor paths.
    metrics:
      - Version 2 review verification result.
      - Version 1 reload result.
      - Focused unit, integration, and end-to-end failures.
    evidence: [EV014]
    exploratory: false
    domain:
      test_layer: provider_free_contract_revision
      provider_calls: 0
