heuristics:
  - id: H001
    statement: Treat a fallible maintenance record as a derived review object, not as authoritative world state.
    provenance: ASW-6A-R rule freeze
  - id: H002
    statement: Bind every visible review claim to stable source-record references that the reviewer can cite.
    provenance: ASW-6A-R review contract
  - id: H003
    statement: Keep the treated pack and its expected answer in separate public and private artifacts.
    provenance: ASW-6A-R privacy boundary
  - id: H004
    statement: Prove the interface with deterministic tests, then test the same closed interface with one real model agent.
    provenance: Theo agent-testing direction
