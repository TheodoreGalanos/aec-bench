experiments:
  - id: E001
    verifies: [C001, C003]
    purpose: Validate version 3 evidence, source, baseline, regime, and treatment schemas while retaining exact version 1 and version 2 bytes.
    setup: Frozen task-owned dataclasses, canonical serializer, and historical byte fixtures.
    procedure:
      - Construct valid and invalid version 3 records.
      - Check the 28,800 second stale boundary and the three quality states.
      - Reload historical version 1 and version 2 artifacts and compare bytes.
    metrics:
      - Rejected invalid record classes.
      - Historical byte and replay equality.
    evidence: [EV002]
    exploratory: false
    domain:
      test_layer: unit
  - id: E002
    verifies: [C002, C003, C004]
    purpose: Exercise each approved treatment and both inspection choices against the real task-owned state machine.
    setup: Version 3 Pump A and Pump B histories with the bundled approved station data.
    procedure:
      - Schedule each treatment at the next decision point.
      - Advance through activation and any delayed release.
      - Compare public effects, private manifest state, and latent physical state.
      - Attempt physical clearance with condition-check evidence.
    metrics:
      - Evidence-health flags and times.
      - Physical-state equality for non-physical treatments.
      - Authority decision for condition-check evidence.
    evidence: [EV002]
    exploratory: false
    domain:
      test_layer: integration
  - id: E003
    verifies: [C002, C005]
    purpose: Prove durable control scheduling, exact retry, conflict rejection, resume, and replay.
    setup: Real filesystem world-run repository and authorised control surface.
    procedure:
      - Schedule one exact-bound treatment.
      - Retry before and after process restart.
      - Attempt stale, wrong-branch, unknown, raw-state, and conflicting requests.
      - Inspect and recover the immutable treatment result.
    metrics:
      - Selected transition count.
      - Recovered receipt identity.
      - Rejected control classes.
    evidence: [EV002]
    exploratory: false
    domain:
      test_layer: integration
  - id: E004
    verifies: [C001, C005]
    purpose: Preserve version 1 and version 2 reload, migration, crash recovery, and verifier behavior while adding version 3.
    setup: Existing historical fixtures and new version 3 migration and replay cases.
    procedure:
      - Run the existing version tests unchanged.
      - Migrate one valid version 2 state to version 3.
      - Replay mixed actor and host-control transitions.
    metrics:
      - Historical hash equality.
      - Version 3 final state identity and verifier result.
    evidence: [EV002, EV003]
    exploratory: false
    domain:
      test_layer: regression
  - id: E005
    verifies: [C003, C004, C005]
    purpose: Compare the complete public evidence-health journey through direct Python, installed JSON, and local Harbor.
    setup: One fixed treatment schedule, one condition check, one physical inspection, and no model provider.
    procedure:
      - Run the same actor journey on each supported path.
      - Compare public evidence-health records and final state identity.
      - Verify that actor capabilities contain no host controls.
    metrics:
      - Public projection equality.
      - Final state and verifier equality.
    evidence: [EV002]
    exploratory: false
    domain:
      test_layer: end_to_end
  - id: E006
    verifies: [C002, C005]
    purpose: Prove handover completeness, treatment privacy, crash recovery, and strict reload.
    setup: Version 3 run stopped before and after treatment activation and resumed under a fresh tenure.
    procedure:
      - Create structured handover before and after activation.
      - Crash each new publication boundary.
      - Reload and recover treatment and actor results.
      - Search actor material for private treatment fields.
    metrics:
      - Handover public-state equality.
      - Recovery identity and private-field absence.
    evidence: [EV002]
    exploratory: false
    domain:
      test_layer: end_to_end
  - id: E007
    verifies: [C001, C005]
    purpose: Check cumulative compatibility across the complete wastewater pump-station test folder.
    setup: All pump-station tests with the production deterministic runtime.
    procedure:
      - Run the complete pump-station test folder.
      - Require pristine output.
    metrics:
      - Cumulative tests passed.
    evidence: [EV004]
    exploratory: false
    domain:
      test_layer: cumulative
  - id: E008
    verifies: [C001, C005]
    purpose: Check style, formatting, and static types on the changed Python surface.
    setup: Project Ruff and MyPy configuration.
    procedure:
      - Run Ruff lint on changed Python files.
      - Run Ruff format check on changed Python files.
      - Run MyPy on changed source and ASW-6A test files.
    metrics:
      - Ruff lint issues.
      - Ruff format differences.
      - MyPy issues.
    evidence: [EV005]
    exploratory: false
    domain:
      test_layer: static_quality
