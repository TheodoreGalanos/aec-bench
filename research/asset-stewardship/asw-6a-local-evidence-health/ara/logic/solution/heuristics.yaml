heuristics:
  - id: H001
    statement: Make evidence age a projection of immutable observation time and current world time, not a stored mutable counter.
    provenance: ASW-6A rule freeze
  - id: H002
    statement: Persist a treatment on the world commit chain when it can change future observations.
    provenance: ASW-6A replay boundary
  - id: H003
    statement: Show the actor a fault effect and its evidence-health facts without showing the hidden treatment label.
    provenance: ASW-6A privacy boundary
  - id: H004
    statement: Add a new version instead of changing earlier serialized records.
    provenance: ASW-5 compatibility gate
