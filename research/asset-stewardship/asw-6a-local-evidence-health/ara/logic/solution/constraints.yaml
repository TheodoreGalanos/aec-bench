constraints:
  - id: K001
    statement: Preserve exact version 1 and version 2 durable bytes and replay behavior.
  - id: K002
    statement: Keep every evidence model, treatment rule, source, threshold, and projection task-local.
  - id: K003
    statement: Do not expose treatment identity, future activation, hidden correct values, unaffected controls, or latent physical condition to the actor.
  - id: K004
    statement: Do not permit raw evidence insertion, direct state fields, arbitrary delay values, or treatment classes outside the approved six.
  - id: K005
    statement: Do not add ASW-6A-R, temporal retrieval, an external archive, a model call, branch fan-out, or physical treatments.
  - id: K006
    statement: Do not run the full repository test suite for this stage.
