claims:
  - id: C001
    statement: ASW-4 established a useful continuing-stewardship research object with real model execution, typed world outcomes, durable history, and independently reloadable analysis.
    status: supported
    falsification_criteria:
      - The study does not retain all 64 planned trajectory completion records.
      - World-owned outcomes cannot be separated from host faults.
      - Exact evaluation-endpoint state cannot be recovered from durable history.
      - The report cannot be independently reloaded and recomputed.
    proof:
      experiments: [E001]
      evidence: [EV001, EV002]
    dependencies: []
    provenance: user
    tags: [programme-checkpoint, research-object, durable-evidence]
    domain:
      implementation_stage: ASW-4-checkpoint
  - id: C002
    statement: Structured handover did not change the binary continuity outcome in any analyzable ASW-4C matched pair.
    status: supported
    falsification_criteria:
      - An analyzable pair has different binary outcomes between treatments.
      - The structured-handover minus current-view paired risk difference is not zero.
      - The independently reloaded report differs from the retained result.
    proof:
      experiments: [E001]
      evidence: [EV001]
    dependencies: [C001]
    provenance: source
    tags: [structured-handover, continuity, zero-difference]
    domain:
      implementation_stage: ASW-4-checkpoint
      analyzable_blocks: 28
      paired_risk_difference: 0.0
  - id: C003
    statement: ASW-4C met its frozen coverage and integrity gates without repeating or replacing a trajectory.
    status: supported
    falsification_criteria:
      - Fewer than 28 matched blocks are analyzable.
      - Host-fault arm imbalance exceeds two.
      - A missing or failed trajectory is repeated or replaced.
      - Provider evidence exceeds a retained hard call, spend, turn, or output-token control.
    proof:
      experiments: [E001]
      evidence: [EV001, EV002]
    dependencies: [C001]
    provenance: source
    tags: [coverage, integrity, typed-host-fault]
    domain:
      implementation_stage: ASW-4-checkpoint
      analyzable_blocks: 28
      host_fault_arm_imbalance: 2
