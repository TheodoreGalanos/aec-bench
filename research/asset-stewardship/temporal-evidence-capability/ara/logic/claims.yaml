claims:
  - id: C001
    statement: A temporal corpus can preserve parent-world lineage, source rights, derivation, assumptions, transformations, and constructed-treatment identity without retaining prohibited source bytes.
    status: supported
    falsification_criteria:
      - Corpus publication accepts missing or drifted lineage identity.
      - Cite-only, excluded, or sealed source bytes enter redistributable corpus content.
    proof:
      experiments: [E001]
      evidence: [EV001]
    dependencies: []
    provenance: user_revised
    tags: [corpus, lineage, rights]
    domain:
      work_area: temporal_corpus
  - id: C002
    statement: Local search and fetch are deterministic and reveal only evidence permitted by actor, branch, world time, corpus, and policy.
    status: supported
    falsification_criteria:
      - Future, denied, or sibling evidence changes any visible retrieval property.
      - Identical declared access inputs produce different semantic results.
      - An unissued reference can be fetched.
    proof:
      experiments: [E002]
      evidence: [EV001]
    dependencies: [C001]
    provenance: user_revised
    tags: [retrieval, determinism, privacy]
    domain:
      work_area: deterministic_gateway
  - id: C003
    statement: Each access publishes its visible result, private receipt, budget arithmetic, retained content, and information-set event as one recoverable idempotent operation.
    status: supported
    falsification_criteria:
      - Retry consumes budget twice or creates another logical result.
      - A crash leaves a visible result without its private evidence or information-set binding.
      - Resume or handover changes conserved retrieval state.
    proof:
      experiments: [E003]
      evidence: [EV001]
    dependencies: [C001, C002]
    provenance: user_revised
    tags: [persistence, recovery, handover]
    domain:
      work_area: durable_access
  - id: C004
    statement: Consequential actions can name evidence they relied on, and independent verification distinguishes accessible, observed, relied-on, recorded, and accepted evidence.
    status: supported
    falsification_criteria:
      - An action can rely on evidence that was not supplied in its bound information set.
      - Verification treats retrieval as institutional acceptance or physical truth.
    proof:
      experiments: [E004]
      evidence: [EV001]
    dependencies: [C002, C003]
    provenance: user_revised
    tags: [information-set, reliance, verification]
    domain:
      work_area: verification
  - id: C005
    statement: Direct, installed-interface, Harbor, and TrialRecord reload paths preserve the same temporal-evidence semantics while capability-disabled worlds remain unchanged.
    status: supported
    falsification_criteria:
      - A supported execution path omits or changes temporal evidence.
      - A capability-disabled world exposes a temporal tool, field, or required artifact.
      - A completed local execution cannot be verified and reloaded offline.
    proof:
      experiments: [E005]
      evidence: [EV001]
    dependencies: [C001, C002, C003, C004]
    provenance: user_revised
    tags: [harbor, trial-record, compatibility]
    domain:
      work_area: production_integration
