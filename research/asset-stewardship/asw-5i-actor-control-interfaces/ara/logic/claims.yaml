claims:
  - id: C001
    statement: Direct Python and local Harbor use one task-owned pump-station actor action path behind a task-neutral request and result envelope.
    status: supported
    falsification_criteria:
      - A direct or Harbor action bypasses the actor request contract.
      - The shared harness must know a pump-station action name or field.
    proof:
      experiments: [E002, E003]
      evidence: [EV001, EV002]
    dependencies: []
    provenance: ai_executed
    tags: [actor-api, harbor, task-ownership]
    domain:
      stage: ASW-5I
  - id: C002
    statement: Exact actor bindings and request identities prevent a stale, cross-scope, unknown, or conflicting call from creating a second durable transition.
    status: supported
    falsification_criteria:
      - Any rejected call advances the selected snapshot.
      - An exact retry creates a second transition.
    proof:
      experiments: [E001, E002]
      evidence: [EV001]
    dependencies: [C001]
    provenance: ai_executed
    tags: [idempotency, information-boundary, fail-closed]
    domain:
      stage: ASW-5I
  - id: C003
    statement: Host controls remain separate from actor capabilities and reject unauthorised principals, raw state, and unavailable later-stage operations.
    status: supported
    falsification_criteria:
      - An actor capability catalogue includes a host control.
      - A raw-state or unauthorised control request succeeds.
      - An undeclared evidence, review, rollout, or physical treatment succeeds.
    proof:
      experiments: [E001, E002, E003]
      evidence: [EV001]
    dependencies: []
    provenance: ai_executed
    tags: [control-api, least-authority, negative-access]
    domain:
      stage: ASW-5I
  - id: C004
    statement: The installed JSON interface preserves actor and control separation through create, resume, observe, invoke, capability, and verification calls.
    status: supported
    falsification_criteria:
      - The installed interface needs a second action implementation.
      - Actor input contains a host-control identity or private state.
      - The resulting durable run does not replay through the independent verifier.
    proof:
      experiments: [E003]
      evidence: [EV001]
    dependencies: [C001, C003]
    provenance: ai_executed
    tags: [installed-interface, replay]
    domain:
      stage: ASW-5I
  - id: C005
    statement: ASW-5I preserves the existing pump-station session, Harbor, replay, and cumulative test behavior.
    status: supported
    falsification_criteria:
      - A touched regression test fails.
      - A complete pump-station test fails.
      - Ruff or MyPy reports a changed-surface fault.
    proof:
      experiments: [E004, E005, E006]
      evidence: [EV002, EV003, EV004]
    dependencies: [C001, C002, C003, C004]
    provenance: ai_executed
    tags: [compatibility, quality-gate]
    domain:
      stage: ASW-5I
