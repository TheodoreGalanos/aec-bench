concepts:
  - id: CON001
    name: actor_interface
    definition: The task-neutral envelope for permitted observation and exact-bound task-owned action invocation.
    relations: [CON002, CON003]
  - id: CON002
    name: host_control_interface
    definition: A separate host-authorised surface for declared run-management operations without raw state edits.
    relations: [CON001, CON003]
  - id: CON003
    name: task_semantic_ownership
    definition: The pump-station package owns action names, input rules, projections, effects, and verification.
    relations: [CON001, CON002]
