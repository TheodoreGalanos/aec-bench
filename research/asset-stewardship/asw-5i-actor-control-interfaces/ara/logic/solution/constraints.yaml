constraints:
  - id: K001
    statement: Do not move task action names, fields, rules, projections, or effects into the shared harness.
  - id: K002
    statement: Do not expose host-control capabilities, latent state, future events, or verifier targets to the actor.
  - id: K003
    statement: Do not add raw state mutation or an HTTP service in ASW-5I.
  - id: K004
    statement: Do not add ASW-6A, ASW-6A-R, ASW-7A, or ASW-7B controls before their own stage.
  - id: K005
    statement: Make no model or external provider call in ASW-5I.
