heuristics:
  - id: H001
    statement: Promote a shared invocation envelope only after two real clients use the same task action path.
    provenance: ASW-5I direct and Harbor boundary review
  - id: H002
    statement: Keep host controls out of actor discovery even when both surfaces use one local transport.
    provenance: ASW-5I negative-access gate
  - id: H003
    statement: Add a later control only with its task-owned producer, consumer, verifier, and replay test.
    provenance: ASW-5I retained-stage decision
