claims:
  - id: C001
    statement: Theo approved one phase-bound ASW-4B H2 structured-handover trajectory with the exact provider, model, adapter, execution, token, spend, and logical limits recorded before any provider call.
    status: supported
    falsification_criteria:
      - A provider call occurs before the approval record exists.
      - The executed provider, model, adapter, route, or execution path differs.
      - Cache, advisor, or bash is enabled.
      - The run exceeds any approved call, token, spend, proposal, command, or handover limit.
    proof:
      experiments: [E001]
      evidence: [EV001, EV002, EV004]
    dependencies: []
    provenance: user
    tags: [approval, provider, budget]
    domain:
      implementation_stage: ASW-4B
  - id: C002
    statement: The selected H2 treatment is built from a real durable station history and binds a structured handover at exactly half one diagnostic period after provisional closure.
    status: supported
    falsification_criteria:
      - The handover state is not produced by the promoted physical kernel and operating rules.
      - The handover time differs from provisional closure plus half one diagnostic period.
      - The live run-in limit, verification duty, or provisionally closed work order is missing.
      - The handover changes the authoritative station state.
    proof:
      experiments: [E002]
      evidence: [EV002]
    dependencies: [C001]
    provenance: ai_executed
    tags: [history, handover, temporal]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
      implementation_stage: ASW-4B
  - id: C003
    statement: The one ASW-4B model execution stays inside its approved limits, produces independently reloadable evidence, and remains excluded from the confirmatory estimand.
    status: supported
    falsification_criteria:
      - The provider usage is incomplete or exceeds its authority.
      - The evidence contains credential material.
      - Independent reload differs from the stored report.
      - The report makes a confirmatory conclusion or contains a study outcome.
      - The execution changes task reward.
    proof:
      experiments: [E003]
      evidence: [EV003, EV004]
    dependencies: [C001, C002]
    provenance: ai_executed
    tags: [shakedown, immutable-evidence, exclusion]
    domain:
      implementation_stage: ASW-4B
