claims:
  - id: C001
    statement: The retrieval-state continuity study has one complete provider-independent specification with fixed treatment, scenario, schedule, budget, endpoint, analysis, coverage, and exclusion rules.
    status: supported
    falsification_criteria:
      - The plan does not contain exactly 8 world histories, 32 matched pairs, and 64 planned runs.
      - Treatment order is not balanced within each world history or paired runs are not adjacent.
      - A paired arm differs in any actor-visible input other than the declared retrieval-state projection.
      - A development query route exposes the material record before availability or cannot retrieve and fetch it after availability within budget.
      - The endpoint, interval, coverage, or exclusion rule can change without a new manifest identity.
    proof:
      experiments: [E001]
      evidence: [EV001, EV002]
    dependencies: []
    provenance: ai_executed
    tags: [study-design, temporal-evidence, pairing]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: C002
    statement: Generated provider-free records can exercise clustered analysis, immutable publication, and independent reload without producing a model result or permitting promotion.
    status: supported
    falsification_criteria:
      - The provider-free path makes a provider call or records model tokens or spend.
      - A generated record enters the confirmatory estimate or changes task reward.
      - The known generated paired difference is not 0.5 with interval [0.5, 0.5].
      - Independent reload trusts the stored report without recomputation.
      - The report permits promotion or makes a confirmatory conclusion.
    proof:
      experiments: [E002]
      evidence: [EV002]
    dependencies: [C001]
    provenance: ai_executed
    tags: [provider-free, immutable-evidence, analysis]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: C003
    statement: Under the frozen model condition, preserved unresolved retrieval state did not achieve the minimum meaningful reduction in epistemic decision failure.
    status: supported
    falsification_criteria:
      - The exact 64-run report does not pass integrity and validity with 32 analyzable pairs across 8 world histories.
      - The paired risk difference is not 0.03125 or its 95 percent interval is not [0.0, 0.09375].
      - Independent reload does not reproduce the stored report and execution identities.
      - The frozen decision rule does not return refuted for the recorded estimate and interval.
    proof:
      experiments: [E004]
      evidence: [EV003]
    dependencies: [C001]
    provenance: ai_executed
    tags: [model-study, confirmatory, refuted]
    domain:
      model: au.anthropic.claude-sonnet-4-6
      provider: amazon-bedrock-au-geographic
  - id: C004
    statement: The confirmatory endpoint was dominated by proposal timing, and no run acquired or used the delayed material record.
    status: supported
    falsification_criteria:
      - Fewer than 63 proposals occurred at 7200000 seconds or more than one proposal occurred at the 7203600-second decision point.
      - Any trial execution records material evidence as acquired or used.
      - Any run lacks a durable station proposal.
    proof:
      experiments: [E004]
      evidence: [EV003]
    dependencies: [C003]
    provenance: ai_executed
    tags: [interpretation, temporal-action, endpoint]
    domain:
      pre_window_proposals: 63
      in_window_proposals: 1
      material_evidence_acquired: 0
      material_evidence_used: 0
  - id: C005
    statement: The corrected scenario starts the incoming tenure at the open decision point, makes the delayed report material to the required station action, and resumes only from complete verified trial evidence.
    status: supported
    falsification_criteria:
      - The incoming tenure starts before the material evidence availability event.
      - A general verification request or a condition check without explicit material-report reliance satisfies the endpoint.
      - Resume accepts an incomplete delivery, observation, and trial-execution join.
      - Resume silently repeats an interrupted provider trial.
    proof:
      experiments: [E005]
      evidence: [EV004]
    dependencies: [C004]
    provenance: ai_executed
    tags: [design-correction, decision-point, verified-resume]
    domain:
      provider_calls: 0
      study_outcomes: 0
