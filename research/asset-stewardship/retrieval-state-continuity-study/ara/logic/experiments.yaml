experiments:
  - id: E001
    verifies: [C001]
    purpose: Prove that the content-addressed specification expands into the exact paired plan and binds feasible delayed-evidence retrieval routes.
    setup: Use the certified pump-station package, local temporal corpus, deterministic gateway, and study-local contracts without provider credentials.
    procedure:
      - Build the provider-free manifest and exact paired plan.
      - Check the history, pair, run, schedule, treatment-order, time, budget, and analysis values.
      - Search each frozen development route before material evidence availability.
      - Search and fetch the material record after availability with the same common budget.
      - Remove a planned run and confirm strict plan validation rejects the drift.
    metrics:
      - Eight histories, 32 pairs, and 64 opaque planned run identities exist.
      - Each history has four pairs and balanced first-arm treatment assignment.
      - Every pre-availability search returns no accessible result.
      - Every post-availability route returns and fetches the material evidence.
      - Provider calls and observed study outcomes remain zero.
    evidence: [EV001, EV002]
    exploratory: false
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: E002
    verifies: [C002]
    purpose: Prove the provider-free reducer, immutable publication, and independent reload path with known generated input.
    setup: Use generated analysis records that are explicitly ineligible as model study outcomes.
    procedure:
      - Generate both treatment deliveries and observations for every planned pair.
      - Apply integrity, validity, and endpoint gates in that order.
      - Compute the paired estimate and world-history-clustered interval.
      - Publish all records by content identity.
      - Independently reload all inputs and recompute the report.
    metrics:
      - The known paired difference is 0.5 with interval [0.5, 0.5].
      - Provider calls, tokens, spend, study outcomes, and reward changes are zero.
      - The report conclusion is analysis_fixture and promotion is not permitted.
      - Reloaded and original reports are equal.
    evidence: [EV002]
    exploratory: false
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: E003
    verifies: []
    purpose: Exercise the real model, direct tool loop, host credential boundary, typed station tools, token capture, and retained execution evidence before confirmation.
    setup: Use the approved Amazon Bedrock profile and au.anthropic.claude-sonnet-4-6 with one adjacent treatment pair that cannot enter the confirmatory estimate.
    procedure:
      - Attempt the real provider route and retain pre-inference credential failure evidence.
      - Exercise invalid typed-tool arguments and retain the adapter failure evidence.
      - Return typed tool rejections to the agent so it can correct its request.
      - Run one clean two-trial shakedown and retain usage, world verification, and temporal verification evidence.
    metrics:
      - Credentials remain host-side and no credential values enter retained evidence.
      - Tool contract rejections do not terminate an otherwise correct model run.
      - The clean shakedown completes both treatment arms without an adapter or verifier failure.
      - Input, output, total token, and spend fields are present, with the analysis-token reporting boundary explicit.
    evidence: [EV003]
    exploratory: true
    domain:
      model: au.anthropic.claude-sonnet-4-6
      confirmatory_eligibility: false
  - id: E004
    verifies: [C003, C004]
    purpose: Execute and independently verify the exact frozen 64-run matched-pair model study.
    setup: Use the content-addressed confirmatory manifest, fixed adjacent-pair schedule, approved Bedrock model condition, and direct closed-tool station sessions.
    procedure:
      - Execute every planned run and publish each delivery, observation, trial execution, and world history.
      - Apply integrity, validity, and endpoint gates in the frozen order.
      - Compute the paired risk difference and clustered 95 percent interval.
      - Publish the report and aggregate execution by content identity.
      - Independently reload all retained records and recompute aggregate identities.
      - Audit proposal times and material-evidence acquisition from durable run records.
    metrics:
      - All 64 trials, 32 pairs, and 8 histories are valid and analyzable.
      - Paired risk difference is 0.03125 with interval [0.0, 0.09375].
      - Report conclusion is refuted under the minimum meaningful effect of 0.25.
      - Sixty-three proposals are pre-window, one is in-window, and material acquisition and use are zero.
      - Independent reload reproduces report and execution identities.
    evidence: [EV003]
    exploratory: false
    domain:
      phase: confirmatory
      study_outcomes: 64
  - id: E005
    verifies: [C005]
    purpose: Verify the corrected decision boundary and safe model-study resume path without another provider study.
    setup: Use real durable pump-station sessions, the local temporal corpus, and temporary immutable evidence repositories with no provider registry.
    procedure:
      - Advance the outgoing tenure through the real availability event before handover.
      - Confirm both treatment arms give the incoming tenure the same open decision-point world state.
      - Fetch the delayed report and prove only a report-backed Pump A condition check satisfies the endpoint.
      - Prove a general verification request and a condition check without report reliance fail the endpoint.
      - Publish a complete delivery, observation, and trial-execution join and reload it as resumable progress.
      - Publish an incomplete join and confirm resume rejects it.
    metrics:
      - The incoming world time equals the material evidence availability time.
      - The outgoing continue-operation event is present in structured handover history.
      - Complete joined trial evidence is reusable and incomplete evidence is rejected.
      - Provider calls and new study outcomes remain zero.
    evidence: [EV004]
    exploratory: false
    domain:
      provider_calls: 0
      study_outcomes: 0
