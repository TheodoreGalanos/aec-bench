nodes:
  - id: N001
    type: question
    summary: Can unresolved retrieval-state handover reduce decision failure after delayed evidence becomes available?
    children: [N002]
    also_depends_on: []
    claims_touched: [C001]
    provenance: user
    payload: {}
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: N002
    type: decision
    summary: Freeze one provider-independent paired study before any real model run.
    children: [N003]
    also_depends_on: []
    claims_touched: [C001]
    provenance: user
    payload:
      result: accepted
      provider_calls_allowed: 0
      promotion_permitted: false
    domain:
      study: retrieval-state-continuity-under-delayed-evidence.v1
  - id: N003
    type: experiment
    summary: Validate the exact plan and real deterministic retrieval routes.
    children: [N004]
    also_depends_on: [N002]
    claims_touched: [C001]
    provenance: ai_executed
    payload:
      experiment_id: E001
      result: passed
    domain:
      provider_calls: 0
  - id: N004
    type: experiment
    summary: Publish, reload, and recompute generated clustered analysis evidence.
    children: [N005]
    also_depends_on: [N003]
    claims_touched: [C002]
    provenance: ai_executed
    payload:
      experiment_id: E002
      result: passed
      paired_risk_difference: 0.5
      provider_calls: 0
      study_outcomes: 0
      promotion_permitted: false
    domain:
      report_authority: analysis_fixture
  - id: N005
    type: decision
    summary: Theo approved the exact Bedrock provider, model, route, shakedown pair, and 64-run confirmation.
    children: [N006]
    also_depends_on: [N004]
    claims_touched: []
    provenance: user
    payload:
      status: completed
      confirmatory_eligibility: false
      model: au.anthropic.claude-sonnet-4-6
      synthetic_data_only: true
    domain:
      next_stage: model-agent-shakedown
  - id: N006
    type: dead_end
    summary: The first shakedown route used an invalid default AWS credential context and stopped before inference.
    children: [N007]
    also_depends_on: [N005]
    claims_touched: []
    provenance: ai_executed
    payload:
      hypothesis: The default AWS credential chain would resolve the approved Bedrock access.
      failure_mode: Bedrock returned 403 before inference, with zero provider calls, tokens, or spend recorded by the adapter.
      lesson: Bind the approved named credential profile at the host boundary and verify its identity before model execution.
    domain:
      result_generation: model-shakedown-v1
  - id: N007
    type: dead_end
    summary: The second shakedown treated a normal typed-tool rejection as a fatal adapter failure.
    children: [N008]
    also_depends_on: [N006]
    claims_touched: []
    provenance: ai_executed
    payload:
      hypothesis: A typed station tool rejection would be returned to the model for correction.
      failure_mode: The direct tool loop surfaced the rejection as a fatal output-contract failure.
      lesson: Return bounded contract rejection details as typed tool results so the agent can correct its request.
    domain:
      result_generation: model-shakedown-v2
  - id: N008
    type: experiment
    summary: Complete the repaired two-run model shakedown with durable usage and verifier evidence.
    children: [N009]
    also_depends_on: [N007]
    claims_touched: []
    provenance: ai_executed
    payload:
      experiment_id: E003
      result: passed_runtime
      confirmatory_eligibility: false
    domain:
      result_generation: model-shakedown-v3
  - id: N009
    type: experiment
    summary: Execute all frozen confirmation runs and independently reload the refuted result.
    children: [N010]
    also_depends_on: [N008]
    claims_touched: [C003, C004]
    provenance: ai_executed
    payload:
      experiment_id: E004
      result: refuted
      paired_risk_difference: 0.03125
      confidence_interval: [0.0, 0.09375]
      integrity_passed: true
      validity_passed: true
    domain:
      result_generation: confirmatory-v2
  - id: N010
    type: observation
    summary: The next study should isolate retrieval continuity from temporal waiting and remove the obvious pre-existing conservative answer.
    children: [N011]
    also_depends_on: [N009]
    claims_touched: [C004]
    provenance: ai_suggested
    payload:
      status: resolved_by_N011
      evidence: EV003
    domain:
      follow_up_required: true
  - id: N011
    type: experiment
    summary: Correct the decision boundary and add verified resume without running another provider study.
    children: []
    also_depends_on: [N010]
    claims_touched: [C005]
    provenance: ai_executed
    payload:
      experiment_id: E005
      result: passed
      evidence: EV004
      provider_calls: 0
      study_outcomes: 0
    domain:
      model_result_changed: false
