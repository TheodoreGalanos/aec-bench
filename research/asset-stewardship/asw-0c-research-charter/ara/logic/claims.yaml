claims:
  - id: C001
    statement: The first authority catalogue can be an explicit synthetic benchmark policy without claiming utility or industry practice.
    status: supported
    falsification_criteria:
      - The programme presents a constructed authority choice as an empirical or operational rule.
      - The action is not credible within the certified synthetic physical boundary.
    proof:
      experiments: []
      evidence: [EV001, EV003]
    dependencies: []
    provenance: user_revised
    tags: [authority, synthetic-policy]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: C002
    statement: Hydraulic clearance loss is the certified secondary physical mechanism even when clearance repair is not a first-study public action.
    status: supported
    falsification_criteria:
      - The accepted mechanism ruling or promoted physical member selects a different secondary mechanism.
    proof:
      experiments: []
      evidence: [EV002]
    dependencies: []
    provenance: source
    tags: [physics, mechanism]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: C003
    statement: Proposal, authority, execution, verification acceptance, and administrative closure must remain distinct first-world transitions.
    status: supported
    falsification_criteria:
      - One public action can directly perform and accept its own physical or verification result.
      - Provisional work-order closure can lift a restriction or fulfil a verification obligation.
    proof:
      experiments: []
      evidence: [EV001, EV003]
    dependencies: [C001]
    provenance: user_revised
    tags: [state-machine, separation]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: C004
    statement: Development design choices can change through reviewed semantic revisions without requiring hand-authored content hashes in the charter.
    status: supported
    falsification_criteria:
      - Different outcome-bearing study revisions are pooled without explicit separation.
      - A development revision is treated as self-authorising only because of its identity.
    proof:
      experiments: []
      evidence: [EV004]
    dependencies: []
    provenance: user
    tags: [identity, revision]
    domain:
      phase: development
  - id: C005
    statement: The reference trajectory must complete inspection before the repair access window to avoid a same-time follow-up breach.
    status: supported
    falsification_criteria:
      - Inspection can start at the repair access time and complete before the declared breach trigger.
      - Canonical event order applies process completion before obligation breach at the same time.
    proof:
      experiments: []
      evidence: [EV005]
    dependencies: [C003, C004]
    provenance: user_revised
    tags: [schedule, obligation, event-order]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
  - id: C006
    statement: A fresh actor tenure can receive complete permitted current state and bounded history inside a timed episode without resetting the world or leaking hidden future schedule through actor-visible identity.
    status: supported
    falsification_criteria:
      - Creating a handover changes authoritative station state, clocks, restrictions, obligations, work orders, evidence, or physical condition.
      - A proposal with a stale base view or information set can execute.
      - Changing only a hidden future schedule changes the actor view or its identity.
      - The current view omits a current quantized reading or an active institutional duty.
    proof:
      experiments: [E001]
      evidence: [EV006]
    dependencies: [C003, C004]
    provenance: ai_executed
    tags: [projection, handover, episode, verifier]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
      implementation_stage: ASW-2A3
  - id: C007
    statement: One task-local immutable commit chain and atomic current-state pointer can preserve a timed pump-station episode across resume without duplicating physical or resource effects on retry.
    status: supported
    falsification_criteria:
      - Resume loses or changes a clock, scheduled event, restriction, obligation, work order, process, evidence record, or transition sequence.
      - A crash before current-state publication changes the selected world.
      - Repeating one committed proposal ID creates another physical duty transfer or another restriction, obligation, or work order.
      - Stored unknown, malformed, non-canonical, or identity-inconsistent content reloads successfully.
    proof:
      experiments: [E002]
      evidence: [EV007]
    dependencies: [C003, C006]
    provenance: ai_executed
    tags: [persistence, snapshot, recovery, exactly-once]
    domain:
      profile: AU-NSW-LH-SYN-SPS-v1
      implementation_stage: ASW-2B
