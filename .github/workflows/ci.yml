# ABOUTME: Runs stable Linux, interactive-world, and stormwater lifecycle evidence gates.
# ABOUTME: Keeps each gate tied to an owned directory instead of a hand-maintained file inventory.

name: Python CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.2"

      - name: Check provenance policy against pull-request base
        if: github.event_name == 'pull_request'
        env:
          AEC_BENCH_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/check_provenance_fields.py
          --check
          --base-revision "$AEC_BENCH_BASE_REVISION"

      - name: Check provenance policy
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_provenance_fields.py --check

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Check public CLI startup
        run: uv run aec-bench --help

      - name: Check optional dependency boundaries
        run: uv run pytest -q tests/cli/test_optional_dependencies.py

      - name: Check provenance policy tests
        run: >-
          uv run pytest -q
          tests/test_provenance_policy.py
          tests/test_provenance_manifest_discovery.py
          tests/docs/test_documentation_ownership.py

      - name: Check repository lint
        run: >-
          uv run ruff check
          src/
          tests/
          scripts/check_provenance_fields.py

      - name: Check provenance policy formatting
        run: >-
          uv run ruff format --check
          scripts/check_provenance_fields.py
          tests/test_provenance_policy.py
          tests/test_provenance_manifest_discovery.py
          tests/docs/test_documentation_ownership.py

      - name: Check provenance policy strict types
        run: >-
          uv run mypy
          scripts/check_provenance_fields.py
          tests/test_provenance_policy.py
          tests/test_provenance_manifest_discovery.py

  packaged-base:
    name: Provider-free wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.2"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build wheel
        run: uv build --wheel

      - name: Verify isolated base installation
        run: >-
          python tests/packaging/verify_wheel_profiles.py
          --wheel dist/aec_bench-0.1.0-py3-none-any.whl
          --profile base

  interactive-worlds:
    name: Interactive worlds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.2"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run interactive-world tests
        run: uv run pytest -q --durations=25 tests/worlds/

      - name: Check owned formatting
        run: >-
          uv run ruff format --check
          src/aec_bench/worlds/
          tests/worlds/

      - name: Check owned strict types
        run: uv run mypy src/aec_bench/worlds/

  canonical-hydraulic-evidence:
    name: Canonical hydraulic evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.2"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run canonical hydraulic evidence tests
        run: uv run pytest -q tests/lifecycles/stormwater_design/

      - name: Check owned formatting
        run: >-
          uv run ruff format --check
          src/aec_bench/lifecycles/stormwater_design/
          tests/lifecycles/stormwater_design/

      - name: Check owned strict types
        run: >-
          uv run mypy
          src/aec_bench/lifecycles/stormwater_design/

  prime-world-journey:
    name: Prime world journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.2"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked Prime Agent dependencies
        run: uv sync --frozen --extra prime-agent

      - name: Run Prime world journey tests
        run: >-
          uv run pytest -q --durations=25
          tests/prime_agent/test_acp.py
          tests/harness/world_actor/
          tests/harness/dam_seepage_prime/test_session.py
          tests/harness/pump_station_prime/test_session.py
          tests/harness/pump_station_prime/test_journey.py

      - name: Check Prime world journey formatting
        run: >-
          uv run ruff format --check
          src/aec_bench/prime_agent/acp.py
          src/aec_bench/prime_agent/skills.py
          src/aec_bench/harness/world_actor/
          src/aec_bench/harness/dam_seepage_prime/
          src/aec_bench/harness/pump_station_prime/evidence.py
          src/aec_bench/harness/pump_station_prime/session.py
          src/aec_bench/harness/pump_station_prime/journey.py
          src/aec_bench/worlds/stewardship/wastewater_pump_station/host_continuation.py
          tests/prime_agent/test_acp.py
          tests/harness/world_actor/
          tests/harness/dam_seepage_prime/
          tests/harness/pump_station_prime/test_session.py
          tests/harness/pump_station_prime/test_journey.py
          tests/worlds/stewardship/wastewater_pump_station/test_host_continuation.py

      - name: Check Prime world journey strict types
        run: >-
          uv run mypy
          src/aec_bench/prime_agent/acp.py
          src/aec_bench/prime_agent/skills.py
          src/aec_bench/harness/world_actor/
          src/aec_bench/harness/dam_seepage_prime/
          src/aec_bench/harness/pump_station_prime/evidence.py
          src/aec_bench/harness/pump_station_prime/session.py
          src/aec_bench/harness/pump_station_prime/journey.py
          src/aec_bench/worlds/stewardship/wastewater_pump_station/host_continuation.py
          tests/prime_agent/test_acp.py
          tests/harness/world_actor/
          tests/harness/dam_seepage_prime/
          tests/harness/pump_station_prime/test_session.py
          tests/harness/pump_station_prime/test_journey.py
          tests/worlds/stewardship/wastewater_pump_station/test_host_continuation.py

  deepseek-release-qualification:
    name: DeepSeek release qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13.2
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.2"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/aec_bench/adapters/deepseek_harness/plugin/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install all-extras dependency profile
        run: uv sync --frozen --all-extras

      - name: Collect the complete Python suite
        run: uv run pytest --collect-only -q tests/

      - name: Run focused DeepSeek qualification gates
        run: >-
          uv run pytest -q
          tests/deepseek_harness/
          tests/harness/world_actor/test_provider_conformance.py
          tests/harness/test_pump_station_harbor.py

      - name: Install the locked DeepSeek plugin toolchain
        working-directory: src/aec_bench/adapters/deepseek_harness/plugin
        run: npm ci

      - name: Test the DeepSeek plugins
        working-directory: src/aec_bench/adapters/deepseek_harness/plugin
        run: npm test

      - name: Rebuild the DeepSeek plugins
        working-directory: src/aec_bench/adapters/deepseek_harness/plugin
        run: npm run build

      - name: Verify reproducible plugin artifacts
        run: git diff --exit-code -- src/aec_bench/adapters/deepseek_harness/plugin/dist/
