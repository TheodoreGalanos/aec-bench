[project]
name = "aec-bench"
version = "0.1.0"
description = "Benchmark platform for evaluating AI agents on AEC engineering tasks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.3,<8.4",
    "jinja2>=3.1,<4",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0,<7",
    "rich>=14.1,<15",
    "typer>=0.25.1,<0.26",
]

[project.scripts]
aec-bench = "aec_bench.cli.main:run"

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.56",
    "hypothesis>=6.130,<7",
    "jsonschema>=4.26.0",
    "mypy>=1.16,<2",
    "pyfiglet>=1.0.4",
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0,<10",
    "ruff>=0.11,<0.12",
    "types-pyyaml>=6.0.12.20260724",
]

[project.optional-dependencies]
execution = ["harbor>=0.1.45"]
morph = ["morphcloud>=0.1.111"]
local-agents = [
    "boto3>=1.42,<2",
    "botocore>=1.42,<2",
    "httpx>=0.28,<1",
    "pydantic-ai>=1.61,<1.62",
]
prime = [
    "packaging>=25,<26",
    "prime==0.6.2",
    "verifiers>=0.1.14,<0.2",
]
webui = [
    "fastapi>=0.128,<1",
    "starlette>=0.48,<1",
    "uvicorn>=0.38,<1",
]
tui = [
    "pillow>=12.1.1",
    "rich-pixels>=3.0.1",
    "textual>=8.1,<9",
]
evolution = [
    "numpy>=2.4,<3",
    "ribs>=0.9.0",
]
prime-agent = [
    "agent-client-protocol>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/.env.example",
    "/pyproject.toml",
    "/uv.lock",
    "/src",
    "/tasks",
    "/tests",
]
exclude = [
    "/.agents",
    "/.claude",
    "/.prime",
    "/.superpowers",
    "/.tmp",
    "/.venv",
    "/.worktrees",
    "/_archive",
    "/artefacts",
    "/configs",
    "/dist",
    "/docs/blog-drafts",
    "/docs/superpowers",
    "/environments",
    "/examples",
    "/jobs",
    "/journal",
    "/memento-test",
    "/node_modules",
    "/packages",
    "/prime-rl",
    "/research",
    "/superpowers",
    "/task_decompositions",
    "/task_genomes",
    "/tasks/generated",
    "/workspaces",
]
artifacts = [
    "/src/aec_bench/web/frontend/dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aec_bench"]
artifacts = [
    "/src/aec_bench/harness/pump_station_prime/skills/**",
    "/src/aec_bench/web/frontend/dist/**",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/aec_bench/cli/**" = ["B008"]
"tests/generation/test_instruction_renderer.py" = ["E501"]
"src/aec_bench/agents/tool_loop_agent.py" = ["E501"]
"src/aec_bench/agents/scripts.py" = ["E501"]
"src/aec_bench/agents/rlm_script.py" = ["E501"]
"examples/agents/script_anthropic.py" = ["E501"]
"examples/agents/script_azure_openai.py" = ["E501"]
"agents/script_anthropic.py" = ["E501"]
"agents/script_azure_openai.py" = ["E501"]
"src/aec_bench/tui/assets/pixel_art.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "typings"
strict = true
