[[relations]]
relation_id = "headloss-plus-power-to-stormwater-pump-package"
purpose = "composition"
source_member_ids = ["hazen-williams-acquisition", "pump-power-acquisition"]
target_member_id = "stormwater-pump-composition-probe"
invariant_dimensions = ["evidence_contract", "hydraulic_domain"]
invariant_claims = [
  "Component A contributes the SI Hazen-Williams loss and pipe-velocity method used by the target rising-main calculation.",
  "Component B contributes the density-times-gravity-times-flow-times-head power method and the efficiency transformation used by the target pump calculation.",
  "The target keeps both components separately observable and requires the calculated loss to enter total dynamic head before power is calculated.",
]
changed_dimensions = ["component_role", "task_scope", "unit_and_method_interface"]
rationale = "The probe changes from two independent formula tasks to a new stormwater memo. It converts the component-A loss into the total-head input required by component B, changes efficiency representation from percent to decimal, and adds capacity, backup-energy, and freeboard checks. The target is therefore not a literal concatenation of the acquisition instructions."
