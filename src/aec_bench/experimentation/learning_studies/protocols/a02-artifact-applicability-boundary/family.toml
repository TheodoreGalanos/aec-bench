[[relations]]
relation_id = "stale-upstream-to-stale-downstream"
purpose = "boundary"
source_member_ids = ["stale-upstream-acquisition"]
target_member_id = "stale-downstream-boundary-probe"
invariant_dimensions = ["review_workflow"]
invariant_claims = [
  "Both tasks require the same provenance ledger, nine review items, transition decision, finding linkage, and readiness vocabulary.",
  "Both tasks contain one real provenance defect and require one localized finding rather than generic non-completion.",
]
changed_dimensions = ["issue_locus", "transition_scope"]
rationale = "The acquisition teaches a valid upstream invalidation response. The probe preserves upstream authority and changes only downstream claim propagation, so repeating the acquisition transition is observably wrong. A civil-engineering domain reviewer and benchmark reviewer must approve this relation before a claim-bearing campaign."
