family_id = "drainage-provenance-boundary"
title = "Drainage provenance defect-scope boundary"
description = "Tests whether an upstream evidence-invalidation response is withheld when the defect is confined to a downstream design memo. Domain and benchmark review remain required before a claim-bearing run."

[[dimensions]]
